[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "controllers", "models", "services", "ui", "visualization"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".idea", ".pytest_cache", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
